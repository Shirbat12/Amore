<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>שאלון Vibe — A-MORE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../assets/theme.css" />
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 4px 16px 36px; }
    .card { margin-bottom: 14px; }
    .q { font-family: var(--serif); font-weight: 500; font-size: 16px; color: var(--ink);
         display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .val { font-family: var(--sans); font-weight: 700; font-size: 14px; color: var(--rose);
           background: var(--blush); border-radius: var(--r-pill); padding: 2px 12px; min-width: 44px; text-align: center; }
    .ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--mauve); margin-top: 8px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .counter { font-size: 12.5px; color: var(--mauve); margin-top: 12px; }
    .intent-row { display: flex; gap: 10px; }
    .intent-row .pill { flex: 1; text-align: center; font-weight: 600; }
    #submit { width: 100%; margin-top: 4px; }
    #status { text-align: center; margin-top: 12px; min-height: 18px; font-size: 14px; }
    #status.ok { color: var(--rose-deep); }
    #status.err { color: #9b3b46; }
  </style>
</head>
<body>
  <header class="amore-header">
    <h1 class="amore-wordmark">A-MORE</h1>
    <p class="amore-tagline">איך היה הדייט? שאלון קצר של 30 שניות</p>
    <div class="rule"><span class="heart">&#9829;</span></div>
  </header>

  <main>
    <div class="card">
      <label class="q" for="interest_flow">עד כמה המפגש היה מעניין והשיחה זרמה?<span class="val" id="interest_flow_val">50</span></label>
      <input type="range" class="vas" id="interest_flow" min="0" max="100" value="50" />
      <div class="ends"><span>משעמם ותקוע</span><span>מרתק, הזמן טס</span></div>
    </div>

    <div class="card">
      <label class="q" for="attraction">האם הרגשת ניצוץ או משיכה רומנטית?<span class="val" id="attraction_val">50</span></label>
      <input type="range" class="vas" id="attraction" min="0" max="100" value="50" />
      <div class="ends"><span>ידידותי בלבד</span><span>משיכה חזקה</span></div>
    </div>

    <div class="card">
      <label class="q" for="reality_match">עד כמה האדם תאם לפרופיל ולציפיות?<span class="val" id="reality_match_val">50</span></label>
      <input type="range" class="vas" id="reality_match" min="0" max="100" value="50" />
      <div class="ends"><span>אין קשר לפרופיל</span><span>התאמה מלאה</span></div>
    </div>

    <div class="card">
      <label class="q" for="comfort">עד כמה הרגשת בנוח ובמרחב בטוח?<span class="val" id="comfort_val">50</span></label>
      <input type="range" class="vas" id="comfort" min="0" max="100" value="50" />
      <div class="ends"><span>חוסר נוחות</span><span>נינוחות מלאה</span></div>
    </div>

    <div class="card">
      <label class="q">על מה דיברתם?</label>
      <div class="tags" id="topic_tags"></div>
      <div class="counter" id="topic_counter"></div>
    </div>

    <div class="card">
      <label class="q">איך הייתה האווירה?</label>
      <div class="tags" id="vibe_tags"></div>
      <div class="counter" id="vibe_counter"></div>
    </div>

    <div class="card">
      <label class="q">תרצי דייט שני?</label>
      <div class="intent-row">
        <button class="pill" data-intent="yes">כן</button>
        <button class="pill" data-intent="maybe">אולי</button>
        <button class="pill" data-intent="no">לא</button>
      </div>
    </div>

    <div class="card">
      <label class="q" for="free_text">ספרי במילים שלך על הדייט:</label>
      <textarea id="free_text" placeholder="היה ממש כיף, הוא היה מצחיק ודברן..."></textarea>
    </div>

    <button id="submit" class="btn btn-rose">שליחה</button>
    <p id="status"></p>
  </main>

  <script src="vibe_form.js"></script>
</body>
</html>
