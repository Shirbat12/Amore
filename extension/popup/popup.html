<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Frank+Ruhl+Libre:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
  <title>A-MORE</title>
</head>
<body>
  <header class="head">
    <h1 class="wordmark">A-MORE</h1>
    <div class="rule"><span class="heart">&#9829;</span></div>
    <p class="tagline">הגדרות התוסף</p>
  </header>

  <label>האימייל / מזהה שלך
    <input id="userId" type="text" placeholder="demo_user" aria-label="מזהה משתמש" />
  </label>
  <p class="hint">משמש לשמירת השאלונים והדאשבורד שלך</p>

  <label class="row">
    <input id="enabled" type="checkbox" checked aria-label="הפעלת התוסף" />
    <span>התוסף פעיל</span>
  </label>

  <button id="save" type="button">שמירה</button>
  <p id="status" role="status"></p>

  <nav class="links" aria-label="קישורים מהירים">
    <a id="dashboard" href="#" class="link-pill">📊 דאשבורד</a>
  </nav>
  <p class="hint">למילוי שאלון אחרי דייט — לחצי <b>📋 שאלון</b> על הפרופיל ב-OkCupid</p>

  <script src="../defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
